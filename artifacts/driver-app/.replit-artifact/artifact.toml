kind = "mobile"
previewPath = "/driver-app/"
title = "Driver App"
description = "A mobile companion app for FamilyMart delivery drivers. Lets drivers view their assigned routes, see all delivery stops in order, check route distance and estimated travel time, navigate to stops on a map, and mark deliveries as visited — all from their phone."
version = "1.0.0"
id = "artifacts/driver-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/driver-app/" ]
localPort = 18809

[services.development]
run = "pnpm --filter @workspace/driver-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/driver-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/driver-app", "run", "serve" ]

[services.env]
PORT = "18809"
BASE_PATH = "/driver-app/"
