name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type-check workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm test --workspace @workspace/api-server

      - name: Build API and web app
        run: npm run build